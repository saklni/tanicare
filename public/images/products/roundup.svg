<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F6FAF6"/>
      <stop offset="100%" stop-color="#E2EEE2"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FCD34D"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="80%" stop-color="#F59E0B"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#EF4444"/>
      <stop offset="60%" stop-color="#DC2626"/>
      <stop offset="100%" stop-color="#B91C1C"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="15" flood-color="#0F3D20" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="380" rx="140" ry="24" fill="#0F3D20" opacity="0.08"/>
  <g filter="url(#shadow)">
    <!-- Tutup Botol -->
    <rect x="268" y="75" width="64" height="35" rx="6" fill="url(#cap)"/>
    <rect x="274" y="65" width="52" height="12" rx="4" fill="#991B1B"/>
    <!-- Leher Botol -->
    <path d="M265 110 L335 110 L350 150 L250 150 Z" fill="url(#bottle)"/>
    <!-- Badan Botol -->
    <rect x="220" y="145" width="160" height="230" rx="20" fill="url(#bottle)"/>
    <!-- Label Kemasan -->
    <rect x="226" y="175" width="148" height="175" rx="8" fill="#FFFFFF"/>
    <!-- Header Label Merah/Biru -->
    <path d="M226 183 Q300 170 374 183 L374 205 L226 205 Z" fill="#1E3A8A"/>
    <text x="300" y="198" font-family="system-ui, sans-serif" font-weight="900" font-size="18" fill="#FBBF24" text-anchor="middle" letter-spacing="1">ROUNDUP</text>
    <rect x="265" y="210" width="70" height="18" rx="4" fill="#DC2626"/>
    <text x="300" y="223" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">486 SL</text>
    <text x="300" y="250" font-family="system-ui, sans-serif" font-weight="700" font-size="12" fill="#1F2937" text-anchor="middle">HERBISIDA SISTEMIK</text>
    <text x="300" y="268" font-family="system-ui, sans-serif" font-weight="500" font-size="9" fill="#4B5563" text-anchor="middle">Isopropilamina Glifosat 486 g/l</text>
    <line x1="245" y1="280" x2="355" y2="280" stroke="#E5E7EB" stroke-width="1.5"/>
    <text x="300" y="300" font-family="system-ui, sans-serif" font-weight="700" font-size="10" fill="#059669" text-anchor="middle">MEMBASMI HINGGA AKAR</text>
    <rect x="250" y="318" width="100" height="22" rx="6" fill="#1E40AF"/>
    <text x="300" y="333" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">ISI: 1 LITER</text>
  </g>
</svg>
