<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="pouch" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="50%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="blueHeader" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0284C7"/>
      <stop offset="100%" stop-color="#0369A1"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#0F172A" flood-opacity="0.14"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="385" rx="145" ry="20" fill="#0F172A" opacity="0.1"/>
  <g filter="url(#shadow)">
    <!-- Pouch Body -->
    <path d="M205 100 Q300 85 395 100 L380 375 Q300 385 220 375 Z" fill="url(#pouch)" stroke="#CBD5E1" stroke-width="2"/>
    <!-- Top Seal lines -->
    <line x1="212" y1="110" x2="388" y2="110" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 2"/>
    <line x1="214" y1="116" x2="386" y2="116" stroke="#94A3B8" stroke-width="1.5" stroke-dasharray="4 2"/>
    
    <!-- Bayer Cross Circle -->
    <circle cx="300" cy="148" r="18" fill="#0284C7"/>
    <text x="300" y="153" font-family="system-ui, sans-serif" font-weight="900" font-size="11" fill="#FFFFFF" text-anchor="middle">BAYER</text>

    <!-- Main Banner -->
    <path d="M214 175 L386 175 L380 235 L220 235 Z" fill="url(#blueHeader)"/>
    <text x="300" y="206" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ANTRACOL</text>
    <rect x="268" y="214" width="64" height="15" rx="3" fill="#FBBF24"/>
    <text x="300" y="225" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#1E293B" text-anchor="middle">70 WP</text>

    <!-- Subtitle & Active ingredient -->
    <text x="300" y="258" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#0369A1" text-anchor="middle">FUNGISIDA KONTAK + ZINC</text>
    <text x="300" y="275" font-family="system-ui, sans-serif" font-weight="600" font-size="9" fill="#475569" text-anchor="middle">Propineb 70% + Seng Aktif</text>
    
    <!-- Zinc Badge -->
    <rect x="250" y="290" width="100" height="30" rx="6" fill="#F0FDF4" stroke="#86EFAC" stroke-width="1.5"/>
    <text x="300" y="304" font-family="system-ui, sans-serif" font-weight="800" font-size="10" fill="#166534" text-anchor="middle">DILENGKAPI ZINC</text>
    <text x="300" y="316" font-family="system-ui, sans-serif" font-weight="600" font-size="8" fill="#15803D" text-anchor="middle">Daun Lebih Hijau &amp; Subur</text>

    <!-- Netto -->
    <rect x="255" y="335" width="90" height="24" rx="5" fill="#0284C7"/>
    <text x="300" y="351" font-family="system-ui, sans-serif" font-weight="800" font-size="12" fill="#FFFFFF" text-anchor="middle">BERAT: 1 KG</text>
  </g>
</svg>