<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFBEB"/>
      <stop offset="100%" stop-color="#FEF3C7"/>
    </linearGradient>
    <linearGradient id="bottle" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E2E8F0"/>
      <stop offset="45%" stop-color="#FFFFFF"/>
      <stop offset="75%" stop-color="#E2E8F0"/>
      <stop offset="100%" stop-color="#CBD5E1"/>
    </linearGradient>
    <linearGradient id="cap" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F59E0B"/>
      <stop offset="60%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="14" flood-color="#78350F" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="600" height="450" fill="url(#bg)"/>
  <ellipse cx="300" cy="385" rx="130" ry="22" fill="#78350F" opacity="0.1"/>
  <g filter="url(#shadow)">
    <!-- Cap -->
    <rect x="270" y="80" width="60" height="32" rx="5" fill="url(#cap)"/>
    <rect x="276" y="70" width="48" height="12" rx="3" fill="#B45309"/>
    <!-- Neck -->
    <path d="M266 112 L334 112 L346 150 L254 150 Z" fill="url(#bottle)"/>
    <!-- Body -->
    <rect x="230" y="145" width="140" height="230" rx="20" fill="url(#bottle)" stroke="#CBD5E1" stroke-width="1"/>
    <!-- Label -->
    <rect x="236" y="172" width="128" height="178" rx="7" fill="#FFFFFF"/>
    
    <!-- Bayer Header -->
    <path d="M236 172 L364 172 L364 198 L236 198 Z" fill="#0284C7"/>
    <text x="300" y="190" font-family="system-ui, sans-serif" font-weight="900" font-size="12" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">BAYER CROPSCIENCE</text>
    
    <!-- Decis Name -->
    <text x="300" y="230" font-family="system-ui, sans-serif" font-weight="900" font-size="24" fill="#B45309" text-anchor="middle">DECIS</text>
    <rect x="265" y="238" width="70" height="18" rx="4" fill="#DC2626"/>
    <text x="300" y="251" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">25 EC</text>
    
    <text x="300" y="278" font-family="system-ui, sans-serif" font-weight="700" font-size="11" fill="#1F2937" text-anchor="middle">INSEKTISIDA KONTAK</text>
    <text x="300" y="294" font-family="system-ui, sans-serif" font-weight="500" font-size="8.5" fill="#4B5563" text-anchor="middle">Deltametrin 25 g/l</text>
    <line x1="248" y1="304" x2="352" y2="304" stroke="#E5E7EB" stroke-width="1.5"/>
    
    <text x="300" y="322" font-family="system-ui, sans-serif" font-weight="700" font-size="9.5" fill="#DC2626" text-anchor="middle">KNOCK-DOWN CEPAT</text>
    <rect x="252" y="332" width="96" height="18" rx="4" fill="#1E3A8A"/>
    <text x="300" y="345" font-family="system-ui, sans-serif" font-weight="800" font-size="11" fill="#FFFFFF" text-anchor="middle">ISI: 500 ML</text>
  </g>
</svg>